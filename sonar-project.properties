# What SonarQube Cloud analyzes (.github/workflows/test.yml, the SonarQube
# job). The organization and project key come from the workflow.

# The Dart that Geas is made of, and the Android widgets' Kotlin. The rest
# of the platform folders is generated by Flutter.
sonar.sources=packages/geas_core/lib,apps/geas_cli/lib,apps/geas_cli/bin,apps/geas/lib,apps/geas/android/app/src/main/kotlin
sonar.tests=packages/geas_core/test,apps/geas_cli/test,apps/geas/test
sonar.sourceEncoding=UTF-8

# Written by the tests in the SonarQube job.
sonar.dart.lcov.reportPaths=packages/geas_core/coverage/lcov.info,apps/geas_cli/coverage/lcov.info,apps/geas/coverage/lcov.info
# The widgets are tried on an emulator, not by unit tests.
sonar.coverage.exclusions=apps/geas/android/**

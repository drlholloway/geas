name: test
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  dart:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: cd packages/geas_core && dart test
      - run: cd apps/geas_cli && dart test
      - run: cd apps/geas && flutter test
      - run: mkdir -p build && dart compile exe apps/geas_cli/bin/geas.dart -o build/geas
  linux:
    name: Linux release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev
      - run: flutter pub get
      - run: cd apps/geas && flutter build linux --release
  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: cd apps/geas && flutter build apk --debug
  sonar:
    name: SonarQube
    # Main and pull requests; a release tag is the same code as main.
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The scan signs in to SonarQube Cloud with the workflow's own
      # identity; there's no token to keep.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the whole history, so new code is told from old
      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      # The Flutter that pubspec.lock was written with, since Flutter itself
      # fixes some package versions. After upgrading Flutter on the dev
      # machine: run `flutter pub get`, commit pubspec.lock, and put the
      # new version here.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.2
      # The analysis reads the resolved dependencies, and the tests' coverage.
      # Exactly the versions in pubspec.lock.
      - run: flutter pub get --enforce-lockfile
      - run: cd packages/geas_core && dart test --coverage-path=coverage/lcov.info
      - run: cd apps/geas_cli && dart test --coverage-path=coverage/lcov.info
      - run: cd apps/geas && flutter test --coverage
      - name: Coverage paths from the repo root
        # Flutter writes them relative to the app.
        run: sed -i 's|^SF:lib/|SF:apps/geas/lib/|' apps/geas/coverage/lcov.info
      - uses: SonarSource/sonarqube-auth-action@b372e2c2930aadfcc4f4399446da1e12772709ad # v1.2
        id: auth
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        with:
          args: >
            -Dsonar.organization=${{ steps.auth.outputs.organization }}
            -Dsonar.projectKey=${{ steps.auth.outputs.project-key }}

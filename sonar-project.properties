# What SonarQube Cloud analyzes (.github/workflows/test.yml, the SonarQube
# job). The organization and project key come from the workflow.
#
# SonarQube Cloud analyzes the whole repository. It ignores sonar.sources,
# sonar.tests and sonar.test.inclusions, so the scope is set only by what's
# left out, here and under coverage.

# Flutter's generated Linux runner; none of it is Geas's own code.
sonar.exclusions=apps/geas/linux/**

# Written by the tests in the SonarQube job.
sonar.dart.lcov.reportPaths=packages/geas_core/coverage/lcov.info,apps/geas_cli/coverage/lcov.info,apps/geas/coverage/lcov.info

# Left out of the coverage figure, so it describes Geas's own Dart code:
# the tests themselves, with the screenshot and demo harnesses built on
# them; the native Android and macOS code (tried on an emulator and a Mac);
# the test doubles shipped in core; and the packaging and icon scripts.
sonar.coverage.exclusions=**/test/**,apps/geas/screenshots/**,apps/geas/demo/**,apps/geas/android/**,apps/geas/macos/**,packages/geas_core/lib/testing.dart,packages/geas_core/lib/src/github/fake_github_client.dart,packages/geas_core/lib/src/store/memory_store.dart,packaging/**

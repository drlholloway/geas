# What SonarQube Cloud analyzes (.github/workflows/test.yml, the SonarQube
# job). The organization and project key come from the workflow.
#
# SonarQube Cloud analyzes the whole repository and ignores sonar.sources
# and sonar.tests, so the scope is set by what's left out.
sonar.sourceEncoding=UTF-8

# Flutter's generated Linux runner; none of it is Geas's own code.
sonar.exclusions=apps/geas/linux/**

# Tests, and the screenshot and demo harnesses that are built on them.
sonar.test.inclusions=**/test/**,apps/geas/screenshots/**,apps/geas/demo/**

# Written by the tests in the SonarQube job.
sonar.dart.lcov.reportPaths=packages/geas_core/coverage/lcov.info,apps/geas_cli/coverage/lcov.info,apps/geas/coverage/lcov.info
# Not exercised by the Dart tests: the native Android and macOS code (tried
# on an emulator and a Mac), the test doubles shipped in core, and the
# packaging and icon scripts.
sonar.coverage.exclusions=apps/geas/android/**,apps/geas/macos/**,packages/geas_core/lib/testing.dart,packages/geas_core/lib/src/github/fake_github_client.dart,packages/geas_core/lib/src/store/memory_store.dart,packaging/**

name: geas
description: "Geas, a personal task manager synced through GitHub."
publish_to: 'none'
resolution: workspace
version: 0.2.0+2

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  geas_core:
    path: ../../packages/geas_core
  go_router: ^18.1.3
  home_widget: ^0.10.0
  http: ^1.6.0
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    # Shown in Settings, About.
    - assets/icon/icon_512.png

# Masters are drawn by packaging/icon/make_icon.py; `just icons` regenerates
# them and the per-platform icon sets.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon_1024.png
  adaptive_icon_background: assets/icon/icon_android_bg.png
  adaptive_icon_foreground: assets/icon/icon_android_fg.png
  macos:
    generate: true
    image_path: assets/icon/icon_macos.png

name: geas_core
description: Pure-Dart core for Geas. Task and list models, the Markdown + YAML file format, per-task merge, the GitHub sync client and the local cache. No Flutter.
version: 0.2.0
publish_to: none
resolution: workspace
environment:
  sdk: ^3.6.0
dependencies:
  collection: ^1.19.1
  crypto: ^3.0.8
  http: ^1.6.0
  path: ^1.9.1
  yaml: ^3.1.4
  yaml_edit: ^2.2.4
dev_dependencies:
  lints: ^6.1.0
  test: ^1.25.0
